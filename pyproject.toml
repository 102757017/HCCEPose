    "torch>=2.1.2",
    "torchaudio>=2.1.2",
    "torchvision>=0.16.2",
    "kornia==0.6.9",
    "diffrp-nvdiffrast>=0.3.3.1",
    "fvcore==0.1.5.post20221221",
]
cuda =[
    "torch>=2.1.2",
    "torchaudio>=2.1.2",
    "torchvision>=0.16.2",
    "kornia==0.6.9",
    "diffrp-nvdiffrast>=0.3.3.1",
    "fvcore==0.1.5.post20221221",
]

s1 =[
    "pymeshlab>=2023.12.post1",
    "kasal-6d==0.1.4",
    "polyscope<2.4.0",
]

s2 =[
    "huggingface-hub[hf-transfer]==0.36.0",
    "trimesh==4.2.2",
    "pypng>=0.20220715.0",
    "pyrender>=0.1.45",
    "bpy==3.6.0",
    "rich==14.2.0",
    "h5py==3.15.1",
    "scikit-image==0.25.0",
    "kasal-6d==0.1.4",
    "pymeshlab>=2023.12.post1",
]

s3 =[
    "ultralytics==8.4.16",
]


#PyOpenGL的EGL后端依赖libegl1-mesa-dev libgl1-mesa-dev
s4 =[
    "pyvirtualdisplay",
    "pypng>=0.20220715.0",
    "kasal-6d==0.1.4",
    "vispy>=0.16.1",
    "pyopengl>=3.1.0",
	"onnxruntime-openvino==1.23.0",
    "matplotlib==3.10.7",
]

s5 =[
	"onnxruntime-openvino==1.23.0",
	"onnx",
]

[dependency-groups]
back =[
    "cython==3.2.1",
    "glumpy>=1.2.1",
    "huggingface-hub[hf-transfer]==0.36.0",
    "imageio==2.37.2",
    "imgaug>=0.4.0",
    "kiwisolver==1.4.9",
    "mathutils<5.0.0",
    "ninja==1.11.1.1",
    "numpy==1.26.4",
    "open3d==0.19.0",
    "opencv-contrib-python==4.9.0.80",
    "opencv-python==4.9.0.80",
    "pillow==11.3.0",
    "pybind11==2.12.0",
    "pypng>=0.20220715.0",
    "pyrender>=0.1.45",
    "pytz>=2026.2",
    "scipy==1.15.3",
    "setuptools<70.0.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.66.5",
    "transformations==2024.6.1",
    "triangle>=20250106",
    "trimesh==4.2.2",
    "ultralytics==8.4.16",
    "wheel",
	"comm==0.2.3",
	"pip",
]


[tool.uv]
compile-bytecode = true
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
# 这里是核心：防止 CPU 和 CUDA 同时安装
conflicts = [[ { extra = "cpu" }, { extra = "cuda" } ]]

[tool.uv.extra-build-dependencies]
glumpy =["setuptools", "numpy", "cython", "wheel"]

# 定义索引
[[tool.uv.index]]
name = "blender"
url = "https://download.blender.org/pypi/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 条件化源映射
[tool.uv.sources]
bpy = { index = "blender" }
torch =[
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" }
]
torchvision =[
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" }
]
torchaudio =[
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" }
]

[tool.setuptools]
packages = []  # 强制关闭自动扫描，什么都不打包，只装依赖